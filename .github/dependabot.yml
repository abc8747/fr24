version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "every 2 weeks at 8am"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "types-protobuf"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "every 2 weeks at 8am"
      timezone: "Etc/UTC"
